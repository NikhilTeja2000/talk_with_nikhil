[project]
name = "talk-with-nikhil-backend"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "google-adk>=0.3.0",
    "google-genai>=1.0.0",
    "supabase>=2.0.0"
]

[tool.pyrefly]
source-roots = ["."]
search-paths = [
    ".",
    ".venv/lib/python3.9/site-packages"
]
site-package-path = ".venv/lib/python3.9/site-packages"
